<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#37474f"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a237e">Quantization-Aware Training: per-layer pipeline</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#546e7a">Each QConv2d / QLinear wraps the floating-point op with the same forward quantize &#8594; dequantize step</text>

  <!-- Forward boxes -->
  <g stroke="#37474f" stroke-width="1.5">
    <rect x="20" y="95" width="150" height="86" rx="10" fill="#e8eaf6"/>
    <rect x="210" y="95" width="150" height="86" rx="10" fill="#e3f2fd"/>
    <rect x="400" y="95" width="150" height="86" rx="10" fill="#e0f7fa"/>
    <rect x="590" y="95" width="150" height="86" rx="10" fill="#e8f5e9"/>
    <rect x="780" y="95" width="150" height="86" rx="10" fill="#fff3e0"/>
  </g>

  <text x="95" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1a237e">Input x</text>
  <text x="95" y="150" text-anchor="middle" font-size="12" fill="#455a64">FP32 tensor</text>
  <text x="95" y="168" text-anchor="middle" font-size="11" fill="#78909c">weights / activations</text>

  <text x="285" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1a237e">Scale</text>
  <text x="285" y="150" text-anchor="middle" font-size="11.5" fill="#455a64">observer / min-max</text>
  <text x="285" y="167" text-anchor="middle" font-size="11.5" fill="#455a64">LSQ s, PACT &#945;, SAWB</text>

  <text x="475" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1a237e">Round</text>
  <text x="475" y="150" text-anchor="middle" font-size="11.5" fill="#455a64">nearest</text>
  <text x="475" y="167" text-anchor="middle" font-size="11.5" fill="#455a64">stochastic</text>

  <text x="665" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1a237e">Representation</text>
  <text x="665" y="150" text-anchor="middle" font-size="11.5" fill="#455a64">int &#183; fp</text>
  <text x="665" y="167" text-anchor="middle" font-size="11.5" fill="#455a64">rdx2 &#183; rdx4 (4-bit)</text>

  <text x="855" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1a237e">Dequantize</text>
  <text x="855" y="150" text-anchor="middle" font-size="11.5" fill="#455a64">&#215; scale</text>
  <text x="855" y="167" text-anchor="middle" font-size="11.5" fill="#455a64">&#8594; FP32 output</text>

  <!-- Forward arrows -->
  <g stroke="#37474f" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="138" x2="204" y2="138"/>
    <line x1="360" y1="138" x2="394" y2="138"/>
    <line x1="550" y1="138" x2="584" y2="138"/>
    <line x1="740" y1="138" x2="774" y2="138"/>
  </g>

  <!-- Backward band -->
  <rect x="20" y="222" width="910" height="86" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="252" font-size="14" font-weight="700" fill="#b71c1c">Backward pass &#8212; Straight-Through Estimator (STE)</text>
  <text x="40" y="276" font-size="12.5" fill="#b71c1c">Gradients flow through the rounding op unchanged (identity).</text>
  <text x="40" y="296" font-size="12.5" fill="#b71c1c">Optionally the gradient/&#8220;error&#8221; signal is quantized: --error_qmode fixed | absmax | adaptive.</text>
  <g stroke="#c62828" stroke-width="2.5" fill="none" marker-end="url(#arrowBack)">
    <line x1="855" y1="200" x2="855" y2="216"/>
    <line x1="95" y1="200" x2="95" y2="216"/>
  </g>
</svg>
